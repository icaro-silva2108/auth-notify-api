spring:
  application:
    name: login-system

  datasource:
    url: jdbc:h2:mem:test-db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop

  h2:
    console:
      enabled: true
      path: /h2-console

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

  rabbitmq:
    addresses: ${CLOUD_AMQP_URL}
    username: ${CLOUD_AMQP_USERNAME}
    password: ${CLOUD_AMQP_PASSWORD}
    virtual-host: ${CLOUD_AMQP_VIRTUAL_HOST}

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

server:
  port: 8080